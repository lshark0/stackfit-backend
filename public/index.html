<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
  :root{
    --ink:#14171C; --ink-soft:#1E232B; --ink-line:#2B313B;
    --paper:#F7F6F2; --paper-dim:#ECEAE3; --card:#FFFFFF;
    --amber:#E8A33D; --amber-deep:#C6822A; --amber-soft:#F7E2BB;
    --cyan:#2FB6A6; --cyan-soft:#CFF0EA;
    --slate:#5B6472; --slate-light:#9AA1AC; --line:#E1DED6; --danger:#E2604F;
    --radius-lg:22px; --radius-md:14px;
    --mono:'JetBrains Mono',monospace;
    --sans:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--paper);
    font-family:var(--sans); min-height:100vh; min-height:100dvh;
    display:flex; justify-content:center;
  }
  .app-shell{
    width:100%; max-width:480px; min-height:100vh; min-height:100dvh;
    background:var(--paper); display:flex; flex-direction:column; position:relative;
    box-shadow:0 0 40px rgba(0,0,0,.08);
  }
  .safe-top{flex:0 0 auto; height:env(safe-area-inset-top, 0px); background:var(--paper);}
  .safe-bottom-spacer{height:env(safe-area-inset-bottom, 0px); flex:0 0 auto; background:var(--paper);}
  .screen{background:var(--paper); flex:1; width:100%; overflow:hidden; display:flex; flex-direction:column; position:relative; min-height:0;}
  .statusbar{height:6px; flex:0 0 auto;}
  .statusbar .dots{display:flex; gap:4px; align-items:flex-end;}
  .statusbar .bar{width:3px; background:var(--ink); border-radius:1px;}
  .app-header{padding:2px 20px 12px; flex:0 0 auto; display:flex; flex-direction:column; gap:10px;}
  .app-header .row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .role-chip{font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; padding:5px 10px; border-radius:999px; background:var(--ink); color:var(--amber-soft); display:inline-flex; align-items:center; gap:6px; text-transform:uppercase;}
  .role-chip .dot{width:6px; height:6px; border-radius:50%; background:var(--amber);}
  .icon-btn{width:36px; height:36px; border-radius:11px; background:var(--card); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--ink); position:relative; cursor:pointer;}
  .icon-btn .badge{position:absolute; top:-4px; right:-4px; background:var(--danger); color:#fff; font-family:var(--mono); font-size:9px; font-weight:700; min-width:15px; height:15px; border-radius:8px; display:flex; align-items:center; justify-content:center; padding:0 3px;}
  .page-title{font-size:22px; font-weight:700; color:var(--ink); letter-spacing:-.01em;}
  .page-sub{font-size:12.5px; color:var(--slate); font-family:var(--mono);}
  .back-row{display:flex; align-items:center; gap:12px;}
  .back-btn{width:34px; height:34px; border-radius:10px; background:var(--card); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--ink); cursor:pointer; flex:0 0 auto;}
  .content{flex:1 1 auto; overflow-y:auto; padding:0 20px 18px; -ms-overflow-style:none; scrollbar-width:none;}
  .content::-webkit-scrollbar{display:none;}
  .section-label{font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--slate); margin:16px 0 10px; display:flex; align-items:center; gap:8px;}
  .section-label::after{content:""; flex:1; height:1px; background:var(--line);}
  .search-box{display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 13px; margin-top:2px;}
  .search-box input{border:none; outline:none; font-family:var(--sans); font-size:13px; flex:1; background:transparent; color:var(--ink);}
  .search-box input::placeholder{color:var(--slate-light);}
  .search-box svg{flex:0 0 auto; color:var(--slate-light);}
  .chip-row{display:flex; gap:8px; margin:12px 0 4px; overflow-x:auto;}
  .chip{font-family:var(--mono); font-size:11.5px; border-radius:999px; padding:7px 13px; background:var(--paper-dim); color:var(--ink); border:1px solid var(--line); cursor:pointer; white-space:nowrap; flex:0 0 auto;}
  .chip.active{background:var(--ink); color:var(--amber-soft); border-color:var(--ink);}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius-md); padding:15px; margin-bottom:10px; transition:.15s;}
  .card.clickable{cursor:pointer;}
  .card.clickable:active{transform:scale(.98);}
  .card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .card-title{font-size:15px; font-weight:700; color:var(--ink); line-height:1.35;}
  .card-org{font-size:12px; color:var(--slate); margin-top:2px;}
  .tag-row{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;}
  .tag{font-family:var(--mono); font-size:10.5px; padding:4px 8px; border-radius:6px; background:var(--paper-dim); color:var(--ink); border:1px solid var(--line);}
  .tag.on{background:var(--ink); color:var(--amber-soft); border-color:var(--ink);}
  .tag.rm{cursor:pointer;}
  .meta-row{display:flex; align-items:center; gap:12px; margin-top:11px; font-size:11.5px; color:var(--slate); flex-wrap:wrap;}
  .meta-row span{display:flex; align-items:center; gap:4px;}
  .rate{font-family:var(--mono); font-weight:700; color:var(--ink); font-size:13px;}
  .gauge{display:flex; align-items:center; gap:8px; margin-top:12px;}
  .gauge-label{font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; color:var(--slate); text-transform:uppercase; white-space:nowrap;}
  .gauge-track{flex:1; height:7px; border-radius:4px; position:relative; overflow:hidden; background:repeating-linear-gradient(90deg, var(--paper-dim) 0 8px, #E4E1D8 8px 9px);}
  .gauge-fill{position:absolute; top:0; left:0; height:100%; border-radius:4px; background:linear-gradient(90deg, var(--amber), var(--cyan));}
  .gauge-value{font-family:var(--mono); font-weight:700; font-size:12px; color:var(--ink); min-width:34px; text-align:right;}
  .avatar{width:44px; height:44px; border-radius:12px; flex:0 0 auto; background:linear-gradient(150deg, var(--ink), var(--ink-soft)); color:var(--amber-soft); font-family:var(--mono); font-weight:700; font-size:14px; display:flex; align-items:center; justify-content:center;}
  .avatar.lg{width:64px; height:64px; border-radius:16px; font-size:19px;}
  .star-btn{width:34px; height:34px; border-radius:10px; background:var(--card); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--slate-light); cursor:pointer; flex:0 0 auto;}
  .star-btn.filled{color:var(--amber); border-color:var(--amber-soft); background:var(--amber-soft);}
  .btn{font-family:var(--sans); font-weight:600; font-size:14px; padding:13px 18px; border-radius:12px; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; width:100%;}
  .btn-primary{background:var(--ink); color:#F5D9A8;}
  .btn-primary:disabled{background:var(--paper-dim); color:var(--slate-light); cursor:default;}
  .btn-outline{background:var(--card); color:var(--ink); border:1px solid var(--line);}
  .btn-ghost{background:transparent; color:var(--slate); border:1px dashed var(--line);}
  .onb-wrap{flex:1; display:flex; flex-direction:column; justify-content:center; padding:0 26px 40px; gap:20px;}
  .brand-mark{display:flex; align-items:center; gap:10px;}
  .brand-mark .sq{width:34px; height:34px; border-radius:9px; background:var(--ink); position:relative;}
  .brand-mark .sq::before,.brand-mark .sq::after,.brand-mark .sq .mid{content:""; position:absolute; left:9px; width:16px; height:3px; border-radius:1.5px; background:var(--amber);}
  .brand-mark .sq::before{top:10px;}
  .brand-mark .sq .mid{top:15.5px; background:var(--amber);}
  .brand-mark .sq::after{top:21px; background:var(--cyan);}
  .brand-name{font-weight:700; font-size:18px; letter-spacing:-.01em; color:var(--ink);}
  .brand-tag{font-family:var(--mono); font-size:10.5px; color:var(--slate); letter-spacing:.08em; text-transform:uppercase;}
  .onb-headline{font-size:24px; font-weight:700; line-height:1.32; color:var(--ink); letter-spacing:-.015em;}
  .onb-headline em{font-style:normal; color:var(--amber-deep);}
  .role-card{background:var(--card); border:1.5px solid var(--line); border-radius:16px; padding:16px; display:flex; align-items:center; gap:14px; cursor:pointer;}
  .role-card:active{border-color:var(--ink);}
  .role-card .ic{width:46px; height:46px; border-radius:13px; background:var(--paper-dim); display:flex; align-items:center; justify-content:center; color:var(--ink); flex:0 0 auto;}
  .role-card .tt{font-weight:700; font-size:14.5px; color:var(--ink);}
  .role-card .ds{font-size:11.5px; color:var(--slate); margin-top:2px;}
  .server-line{font-family:var(--mono); font-size:10.5px; color:var(--slate); text-align:center; line-height:1.6;}
  .server-line b{color:var(--ink); cursor:pointer; text-decoration:underline;}
  .stat-strip{display:flex; gap:8px; margin-top:4px;}
  .stat-box{flex:1; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; cursor:pointer; transition:.12s;}
  .stat-box:active{transform:scale(.96); background:var(--paper-dim);}
  .stat-num{font-family:var(--mono); font-weight:700; font-size:19px; color:var(--ink);}
  .stat-lbl{font-size:10.5px; color:var(--slate); margin-top:3px;}
  .banner{background:linear-gradient(135deg, var(--ink) 0%, var(--ink-soft) 100%); border-radius:18px; padding:18px; color:#fff; position:relative; overflow:hidden; margin-top:16px; cursor:pointer;}
  .banner::after{content:""; position:absolute; right:-30px; top:-30px; width:120px; height:120px; border-radius:50%; background:radial-gradient(circle, rgba(232,163,61,.35), transparent 70%);}
  .banner::before{content:""; position:absolute; left:-20px; bottom:-40px; width:110px; height:110px; border-radius:32px; transform:rotate(28deg); background:linear-gradient(135deg, rgba(47,182,166,.16), transparent 65%); pointer-events:none;}
  .banner > *{position:relative; z-index:1;}
  .hero-art{position:absolute; right:0; top:0; width:150px; height:100%; opacity:.9; pointer-events:none;}
  .banner-eyebrow{font-family:var(--mono); font-size:10px; letter-spacing:.12em; color:var(--amber-soft); text-transform:uppercase;}
  .banner-title{font-size:16px; font-weight:700; margin-top:6px; line-height:1.4;}
  .banner-sub{font-size:11.5px; color:#B8BEC8; margin-top:5px;}

  /* 밝은 배너 변형 — 프로필 완성도처럼 자주 보는 카드에 사용 */
  .banner.light{background:linear-gradient(135deg, #FFFFFF 0%, #FDF6E9 100%); color:var(--ink); border:1px solid var(--line); box-shadow:0 3px 14px rgba(20,23,28,.06);}
  .banner.light::after{background:radial-gradient(circle, rgba(232,163,61,.22), transparent 70%);}
  .banner.light::before{background:linear-gradient(135deg, rgba(47,182,166,.14), transparent 65%);}
  .banner.light .banner-eyebrow{color:var(--amber-deep);}
  .banner.light .banner-title{color:var(--ink);}
  .banner.light .banner-sub{color:var(--slate);}
  .banner.light .profile-bar{background:var(--paper-dim);}
  .banner.light .ring-lbl{color:var(--slate);}
  .banner.light .ring-track{stroke:var(--paper-dim);}
  .profile-bar{background:rgba(255,255,255,.18); border-radius:8px; height:8px; overflow:hidden; margin-top:8px;}
  .profile-bar.light{background:var(--paper-dim);}
  .profile-bar-fill{height:100%; background:linear-gradient(90deg,var(--amber),var(--cyan));}
  .detail-hero{background:var(--ink); color:#fff; padding:18px 20px 22px; border-radius:0 0 24px 24px; margin:0 -20px 16px;}
  .detail-hero .org{font-family:var(--mono); font-size:11px; color:var(--amber-soft); letter-spacing:.06em;}
  .detail-hero h2{font-size:19px; font-weight:700; margin-top:6px; line-height:1.4;}
  .kv-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px;}
  .kv-box{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:11px 12px;}
  .kv-lbl{font-family:var(--mono); font-size:9.5px; color:var(--slate); text-transform:uppercase; letter-spacing:.06em;}
  .kv-val{font-size:13.5px; font-weight:700; color:var(--ink); margin-top:3px;}
  .para{font-size:13px; color:var(--ink); line-height:1.75; margin-top:4px;}
  .chat-row{display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); cursor:pointer; align-items:center;}
  .chat-row:last-child{border-bottom:none;}
  .chat-body{flex:1; min-width:0;}
  .chat-name{font-weight:700; font-size:13.5px; color:var(--ink); display:flex; justify-content:space-between;}
  .chat-time{font-family:var(--mono); font-size:10px; color:var(--slate-light); font-weight:400;}
  .chat-preview{font-size:12px; color:var(--slate); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .unread{background:var(--amber); color:var(--ink); font-family:var(--mono); font-weight:700; font-size:10px; width:17px; height:17px; border-radius:50%; display:flex; align-items:center; justify-content:center;}
  .bubble-wrap{display:flex; flex-direction:column; gap:10px; padding:6px 0 14px;}
  .bubble{max-width:76%; padding:10px 13px; border-radius:14px; font-size:13px; line-height:1.5;}
  .bubble.them{background:var(--card); border:1px solid var(--line); color:var(--ink); border-bottom-left-radius:4px;}
  .bubble.me{background:var(--ink); color:#F5EFE4; border-bottom-right-radius:4px;}
  /* 말풍선 한 줄 (취소 버튼이 옆에 붙을 수 있도록) */
  .bubble-line{display:flex; align-items:flex-end; gap:6px; max-width:100%;}
  .bubble-line.me{justify-content:flex-end; align-self:flex-end;}
  .bubble-line.them{justify-content:flex-start; align-self:flex-start;}
  .bubble-cancel{background:none; border:none; padding:4px; cursor:pointer; color:var(--slate-light); opacity:.55; flex:0 0 auto; line-height:0; -webkit-tap-highlight-color:transparent;}
  .bubble-cancel:active{opacity:1; color:var(--danger);}
  /* 켜기/끄기 토글 스위치 */
  .switch{position:relative; display:inline-block; width:44px; height:25px; flex:0 0 auto;}
  .switch input{opacity:0; width:0; height:0;}
  .switch .slider{position:absolute; inset:0; background:var(--line); border-radius:99px; transition:.22s; cursor:pointer;}
  .switch .slider::before{content:""; position:absolute; width:19px; height:19px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.22s; box-shadow:0 1px 3px rgba(0,0,0,.2);}
  .switch input:checked + .slider{background:var(--cyan);}
  .switch input:checked + .slider::before{transform:translateX(19px);}
  .bubble-time{font-family:var(--mono); font-size:9.5px; color:var(--slate-light); margin-top:3px;}
  .chat-input-bar{display:flex; gap:8px; padding:10px 20px 16px; border-top:1px solid var(--line); background:var(--paper); flex:0 0 auto;}
  .chat-input{flex:1; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:11px 14px; font-size:13px; color:var(--ink); font-family:var(--sans); outline:none;}
  .send-btn{width:42px; height:42px; border-radius:12px; background:var(--ink); color:var(--amber-soft); display:flex; align-items:center; justify-content:center; flex:0 0 auto; cursor:pointer; border:none;}
  .mypage-head{display:flex; align-items:center; gap:14px; margin-bottom:6px;}
  .list-item{display:flex; align-items:center; justify-content:space-between; padding:14px 2px; border-bottom:1px solid var(--line); cursor:pointer;}
  .list-item:last-child{border-bottom:none;}
  .list-item .li-l{display:flex; align-items:center; gap:12px;}
  .li-icon{width:34px; height:34px; border-radius:9px; background:var(--paper-dim); display:flex; align-items:center; justify-content:center; color:var(--ink);}
  .li-tt{font-size:13.5px; font-weight:600; color:var(--ink);}
  .tl-item{display:flex; gap:12px; padding-bottom:18px; position:relative;}
  .tl-item::before{content:""; position:absolute; left:6px; top:16px; bottom:-2px; width:1px; background:var(--line);}
  .tl-item:last-child::before{display:none;}
  .tl-dot{width:13px; height:13px; border-radius:50%; border:3px solid var(--amber); background:var(--paper); flex:0 0 auto; margin-top:2px;}
  .tl-dot.done{border-color:var(--cyan); background:var(--cyan);}
  .tl-tt{font-weight:700; font-size:13px; color:var(--ink);}
  .tl-ds{font-size:11.5px; color:var(--slate); margin-top:2px; line-height:1.5;}
  .form-field{margin-bottom:14px;}
  .form-label{font-size:12px; font-weight:600; color:var(--ink); margin-bottom:6px; display:block;}
  .form-input{width:100%; border:1px solid var(--line); background:var(--card); border-radius:10px; padding:12px 13px; font-size:13px; font-family:var(--sans); color:var(--ink); outline:none;}
  .form-input::placeholder{color:var(--slate-light);}
  .form-input:focus{border-color:var(--ink);}
  textarea.form-input{resize:none; height:76px;}
  .add-tag-row{display:flex; gap:8px; margin-top:8px;}
  .add-tag-row input{flex:1;}
  .fab{position:absolute; right:20px; bottom:96px; width:52px; height:52px; border-radius:16px; background:var(--amber); color:var(--ink); display:flex; align-items:center; justify-content:center; box-shadow:0 10px 20px -6px rgba(232,163,61,.55); z-index:12; cursor:pointer; border:none;}
  .toast{position:absolute; bottom:96px; left:50%; transform:translateX(-50%); background:var(--ink); color:#F5EFE4; font-size:12.5px; font-weight:600; padding:11px 18px; border-radius:999px; z-index:30; box-shadow:0 10px 24px rgba(0,0,0,.3); white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; max-width:80%; overflow:hidden; text-overflow:ellipsis;}
  .drawer-overlay{position:absolute; inset:0; background:rgba(20,23,28,.45); opacity:0; pointer-events:none; transition:opacity .22s; z-index:48;}
  .confirm-overlay{position:absolute; inset:0; background:rgba(20,23,28,.5); opacity:0; pointer-events:none; transition:opacity .18s; z-index:58; display:flex; align-items:center; justify-content:center; padding:0 32px;}
  .confirm-overlay.open{opacity:1; pointer-events:auto;}
  .confirm-box{background:var(--paper); border-radius:18px; padding:26px 22px 18px; width:100%; max-width:300px; text-align:center; transform:scale(.92); transition:transform .18s;}
  .confirm-overlay.open .confirm-box{transform:scale(1);}
  .confirm-msg{font-size:15px; font-weight:700; color:var(--ink); line-height:1.5; margin-bottom:20px;}
  .confirm-actions{display:flex; gap:8px;}
  .confirm-actions button{flex:1; padding:12px 0; border-radius:12px; border:none; font-size:14px; font-weight:700; cursor:pointer;}

<body>

  <div class="app-shell">
    <div class="safe-top"></div>
    <div class="screen" id="screen"></div>
    <div class="safe-bottom-spacer"></div>
    <div class="toast" id="toast"></div>
    <div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
    <div class="drawer" id="drawer"></div>
    <div class="confirm-overlay" id="confirmOverlay">
      <div class="confirm-box">
        <div class="confirm-msg" id="confirmMsg"></div>
        <div class="confirm-actions">
          <button class="confirm-cancel" onclick="closeConfirm()">취소</button>
          <button class="confirm-ok" id="confirmOkBtn">확인</button>
        </div>
      </div>
    </div>
  </div>

<script>
/* ---------------- Config & API ---------------- */
let API_BASE = "/api";
let state = { role:null, screen:"onboarding", param:null, prevScreen:"onboarding", token:null, userId:null };

const TOKEN_KEY = 'stackfit_token';
function saveToken(token){
  state.token = token;
  try{ localStorage.setItem(TOKEN_KEY, token); }catch(e){}
}
function clearToken(){
  state.token = null;
  try{ localStorage.removeItem(TOKEN_KEY); }catch(e){}
}

function debounce(fn, ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }


async function apiFetch(path, opts={}){
  const res = await fetch(API_BASE + path, {
    method: opts.method || 'GET',
    headers: { 'Content-Type':'application/json', ...(state.token ? {Authorization:'Bearer '+state.token} : {}) },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  let data = null;
  try{ data = await res.json(); }catch(e){ /* no body */ }
  if(!res.ok){
    const err = new Error((data && data.error) || `요청 실패 (${res.status})`);
    // 서버가 알려준 코드/부가정보를 화면에서 활용할 수 있게 함께 담아 보냅니다.
    if(data && data.code) err.code = data.code;
    if(data && data.missing) err.missing = data.missing;
    err.status = res.status;
    throw err;
  }
  return data;
}
function fileUrl(relPath){
  if(!relPath) return null;
  return API_BASE.replace(/\/api\/?$/, '') + relPath;
}
// 다운로드 대신 브라우저에서 바로 볼 수 있도록 형식별로 경로를 결정합니다.
// PDF는 브라우저가 자체적으로 렌더링하고, Word/PPT는 구글 문서뷰어를 통해 미리보기를 띄웁니다.
// 한글(HWP)은 브라우저/구글뷰어 모두 지원하지 않아 다운로드로 열립니다.
function viewerUrl(relPath){
  if(!relPath) return null;
  const absolute = window.location.origin + fileUrl(relPath);
  const ext = (relPath.split('?')[0].split('.').pop() || '').toLowerCase();
  if(['doc','docx','ppt','pptx'].includes(ext)){
    return 'https://docs.google.com/viewer?embedded=true&url=' + encodeURIComponent(absolute);
  }
  return absolute;
}
// 일부 모바일 브라우저(삼성인터넷 등)는 <a download> 속성을 무시하고 그냥 페이지 이동을
// 시켜버리는 경우가 있어서, 파일을 직접 fetch해서 blob으로 강제 저장시킵니다.
async function downloadResume(relPath, filename){
  if(!relPath) return;
  try{
    toast('다운로드 중...');
    const res = await fetch(fileUrl(relPath));
    if(!res.ok) throw new Error('다운로드에 실패했어요');
    const blob = await res.blob();
    const blobUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = blobUrl;
    a.download = filename || '경력기술서';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(blobUrl), 8000);
  }catch(e){ toast(e.message); }
}
function jsAttrStr(s){
  return String(s ?? '').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;').replace(/</g,'&lt;');
}
async function unreadCount(){
  if(!state.token) return 0;
  try{
    const d = await apiFetch('/notifications');
    // 채팅 메시지는 하단 '채팅' 탭 배지가 따로 알려주므로, 종 아이콘에서는 제외해
    // 두 숫자가 서로 어긋나 보이지 않게 합니다.
    return d.notifications.filter(n=>!n.is_read && n.tag !== '메시지').length;
  }catch(e){ return 0; }
}

// 안 읽은 채팅 메시지 수. 화면을 그릴 때마다 매번 서버에 묻지 않도록 아주 짧게(8초) 캐시합니다.
let _chatUnread = { value: 0, at: 0 };
async function chatUnreadCount(force){
  if(!state.token) return 0;
  const now = Date.now();
  if(!force && now - _chatUnread.at < 8000) return _chatUnread.value;
  try{
    const d = await apiFetch('/conversations');
    const total = d.conversations.reduce((sum, c) => sum + (c.unread || 0), 0);
    _chatUnread = { value: total, at: now };
    return total;
  }catch(e){ return _chatUnread.value; }
}
// 탭바를 다시 그리지 않고 채팅 배지만 갱신합니다.
async function refreshChatBadge(){
  const n = await chatUnreadCount(true);
  const btn = document.querySelector('.tab-btn[data-tab="chatList"]');
  if(!btn) return;
  const old = btn.querySelector('.tab-badge');
  if(old) old.remove();
  if(n > 0){
    const span = document.createElement('span');
    span.className = 'tab-badge';
    span.textContent = n > 99 ? '99+' : String(n);
    btn.appendChild(span);
  }
}

/* ---------------- Icons ---------------- */
const I = {
  menu:`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 6.5H20M4 12H20M4 17.5H20" stroke-linecap="round"/></svg>`,
  checkCircle:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M7.5 12.5l3 3 6-6.5" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  clockSm:`<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5.5l3.5 2" stroke-linecap="round"/></svg>`,
  xCircle:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M9 9l6 6M15 9l-6 6" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>`,
  trophy:`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M7 4h10v6a5 5 0 0 1-10 0V4z" stroke-linejoin="round"/><path d="M7 6H4.5a2.5 2.5 0 0 0 2.5 4M17 6h2.5a2.5 2.5 0 0 1-2.5 4" stroke-linecap="round"/><path d="M12 15v4M9 21h6" stroke-linecap="round"/></svg>`,

/* ---------------- Nav / shell ---------------- */
function go(screen, param){
  if(state.screen!=='alerts') state.prevScreen = state.screen;
  state.screen = screen; state.param = param ?? null;
  history.pushState({screen: state.screen, param: state.param}, '', location.pathname);
  render();
}
window.go = go;

// 휴대폰의 '뒤로가기' 버튼/제스처를 앱 내 화면 이동과 연결합니다.
window.addEventListener('popstate', (ev) => {
  const s = ev.state;
  if(s && s.screen){
    state.screen = s.screen; state.param = s.param ?? null;
  } else {
    state.screen = 'onboarding'; state.param = null;
  }
  render();
});

function drawerMenuContent(){
  const isCompany = state.role==='company';
  const roleLabel = isCompany ? '기업 회원' : '프리랜서 회원';
  const item = (icon, label, screen, danger) => `<div class="drawer-item ${danger?'danger':''}" onclick="closeDrawer(); go('${screen}');"><span class="ic">${icon}</span>${label}</div>`;

  const exploreItems = isCompany ? `
    ${item(I.home,'홈','home')}

  ` : `

  return `

function openDrawer(){
  document.getElementById('drawer').innerHTML = drawerMenuContent();
  document.getElementById('drawerOverlay').classList.add('open');
  document.getElementById('drawer').classList.add('open');
}
function closeDrawer(){
  document.getElementById('drawerOverlay').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
}

function toast(msg){
  const t = document.getElementById('toast');
  if(!t) return;
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 3000);
}

// ── 그래픽 컴포넌트 ──────────────────────────────
// 원형 도넛 게이지 (프로필 완성도, 매칭률 등)
function ringGauge(pct, label, color){
  const p = Math.max(0, Math.min(100, Number(pct)||0));
  const r = 44, c = 2 * Math.PI * r;
  const offset = c - (p/100) * c;
  return `<div class="ring">
    <svg width="104" height="104" viewBox="0 0 104 104">
      <circle class="ring-track" cx="52" cy="52" r="${r}" fill="none" stroke-width="10"/>
      <circle class="ring-fill" cx="52" cy="52" r="${r}" fill="none" stroke-width="10"
        stroke="${color||'var(--amber)'}" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}"/>
    </svg>
    <div class="ring-center"><div class="ring-num">${p}%</div><div class="ring-lbl">${esc(label||'')}</div></div>
  </div>`;
}

// 세로 막대 차트 (등급별/업무별 분포 등)
function barChart(items, useCyan){
  const max = Math.max(1, ...items.map(i=>i.value));
  return `<div class="barchart">${items.map(i=>{
    const h = Math.round((i.value / max) * 100);
    return `<div class="bcol">
      <div class="bval">${i.value}</div>
      <div class="bbar ${useCyan?'cyan':''}" style="height:${Math.max(4, h)}%"></div>
      <div class="blbl">${esc(i.label)}</div>
    </div>`;
  }).join('')}</div>`;
}

// 프로젝트 진행 단계 시각화
function stepsGraphic(stage, steps){
  const nodes = [];
  steps.forEach((s, i) => {
    const done = i < stage - 1;
    const now = i === stage - 1;
    nodes.push(`<div class="snode ${done?'done':''} ${now?'now':''}">${done?'✓':(i+1)}</div>`);
    if(i < steps.length - 1) nodes.push(`<div class="sline ${i < stage - 1 ?'done':''}"></div>`);
  });
  return `<div class="steps-graphic">${nodes.join('')}</div>
  <div class="steps-labels">${steps.map(s=>`<span>${esc(s)}</span>`).join('')}</div>`;
}

// 공고 요구 기술 대비 보유 여부를 막대로 비교
function skillBars(jobStack, myStack){
  const mine = new Set((myStack||[]).map(s=>s.toLowerCase()));
  return `<div class="skillbars">${(jobStack||[]).slice(0,6).map(s=>{
    const has = mine.has(s.toLowerCase());
    return `<div class="skillbar">
      <span class="sname">${esc(s)}</span>
      <span class="strack"><span class="sfill ${has?'':'miss'}" style="width:${has?100:12}%"></span></span>
      <span class="sicon">${has?'✓':'—'}</span>
    </div>`;
  }).join('')}</div>`;
}

// 작은 스파크라인 (통계 카드 하단 장식 겸 추이 표현)
function sparkline(values){
  const max = Math.max(1, ...values);
  return `<div class="hs-spark">${values.map(v=>{
    const h = Math.max(3, Math.round((v/max)*18));
    return `<i class="${v>0?'on':''}" style="height:${h}px"></i>`;
  }).join('')}</div>`;
}

function gauge(pct){
  return `<div class="gauge"><span class="gauge-label">스택매치</span>
    <div class="gauge-track"><div class="gauge-fill" style="width:${pct}%"></div></div>
    <span class="gauge-value">${pct}%</span></div>`;
}
function statusbar(){
  return `<div class="statusbar"></div>`;
}

// 기업/사람 이름으로 고유한 색상 아바타를 자동 생성합니다 (이미지 업로드 없이도 시각적으로 구분됨).
const AVATAR_COLORS = [
  ['#E8A33D','#C6822A'], ['#2FB6A6','#1E8D80'], ['#6C8EE3','#4763B8'],
  ['#D97B8F','#B15468'], ['#8B7BD8','#6355B0'], ['#5FA860','#3F8442'],
];
function autoAvatar(name, size){
  const label = String(name || '?').trim();
  const initial = label ? label[0] : '?';
  let hash = 0;
  for (let i = 0; i < label.length; i++) hash = (hash * 31 + label.charCodeAt(i)) >>> 0;
  const [c1, c2] = AVATAR_COLORS[hash % AVATAR_COLORS.length];
  const px = size || 44;

const DUTY_ICON = {
  PM:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 19V6M4 6l7-2 6 2 3-1v11l-3 1-6-2-7 2" stroke-linejoin="round"/></svg>`,

  개발자:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 7l-5 5 5 5M15 7l5 5-5 5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,

};
function dutyBadge(duty){
  if(!duty) return '';
  // 정확히 일치하지 않아도(예: "DBA / 튜닝 담당") 키워드가 포함되면 해당 아이콘을 붙입니다.
  let icon = DUTY_ICON[duty];
  if(!icon){
    const upper = String(duty).toUpperCase();
    const key = Object.keys(DUTY_ICON).find(k => upper.includes(k.toUpperCase()));
    icon = key ? DUTY_ICON[key] : DUTY_ICON['기타'];
  }
  return `<span class="dbadge">${icon}${esc(duty)}</span>`;
}

// 등급 배지 — 등급이 높을수록 진한 색 + 채워진 점(●●●●)이 늘어납니다.
const GRADE_RANK = { 초급:1, 중급:2, 고급:3, 특급:4 };
function gradeBadge(grade){
  if(!grade) return '';
  const rank = GRADE_RANK[grade] || 1;
  const pips = [1,2,3,4].map(n=>`<i class="${n<=rank?'on':''}"></i>`).join('');
  return `<span class="gbadge g${rank}"><span class="pips">${pips}</span>${esc(grade)}</span>`;
}

async function consumeOAuthHash(){
  const search = window.location.search;
  if(!search || search.length<2) return false;
  try{
    const params = new URLSearchParams(search.slice(1));
    history.replaceState(null, '', window.location.pathname);

    // 로그인과 무관한 파라미터(예: 홈화면 앱 실행 시 붙는 ?src=pwa)는 그냥 무시합니다.
    const isOAuthCallback = ['oauth_error','token','oauth_pending'].some(k => params.has(k));
    if(!isOAuthCallback) return false;

    if(params.get('oauth_error')){
      lastAuthError = '소셜 로그인 실패 (코드: ' + params.get('oauth_error') + ')';
      return false;
    }
    if(params.get('token')){
      saveToken(params.get('token'));
      try{
        const me = await apiFetch('/auth/me');
        state.role = me.user.role; state.userId = me.user.id;
        toast('로그인 성공');
        go('home');
      }catch(e){ lastAuthError = '로그인 확인 실패: ' + e.message; go('onboarding'); }
      return true;
    }
    if(params.get('oauth_pending')){
      oauthPending = { token: params.get('oauth_pending'), email: params.get('email')||'', name: params.get('name')||'', roleHint: params.get('role_hint')||'' };
      go('oauthRole');
      return true;
    }

// DB의 created_at은 UTC 기준 문자열이라, 'Z'를 붙여야 브라우저가 정확한 현지 시각으로 바꿔줍니다.
// 날짜만 간단히 표시 (2026. 9. 10.)
function fmtDate(s){
  const d = parseServerTime(s);
  return d ? d.toLocaleDateString('ko-KR', {year:'numeric', month:'long', day:'numeric'}) : '';
}
function parseServerTime(s){
  if(!s) return null;
  const d = new Date(String(s).includes('T') ? s : String(s).replace(' ', 'T') + 'Z');
  return isNaN(d.getTime()) ? null : d;
}
function chatBubblesHtml(messages){
  return messages.map(m=>{
    const t = parseServerTime(m.created_at);
    const mine = m.sender_id === state.userId;
    return `
      <div class="bubble-line ${mine?'me':'them'}">
        ${mine?`<button class="bubble-cancel" onclick="cancelMessage(${m.id})" title="메시지 취소">${I.xCircle}</button>`:''}
        <div class="bubble ${mine?'me':'them'}">${esc(m.body)}<div class="bubble-time">${t? t.toLocaleString('ko-KR',{hour:'numeric',minute:'2-digit'}) : ''}</div></div>
      </div>`;
  }).join('') || `<div class="empty"><div class="ic">${I.chat}</div><div class="tt">첫 메시지를 보내보세요</div></div>`;
}
async function cancelMessage(msgId){
  const convId = state.param;
  showConfirm('이 메시지를 취소할까요?', async () => {
    try{
      const data = await apiFetch(`/conversations/${convId}/messages/${msgId}`, {method:'DELETE'});
      toast('메시지를 취소했어요');
      const wrap = document.querySelector('#chatScroll .bubble-wrap');
      if(wrap) wrap.innerHTML = chatBubblesHtml(data.messages);
      else go('chatRoom', convId);
    }catch(e){ toast(e.message); }
  });
}
async function sendMessage(convId){
  const input = document.getElementById('chatInputEl');
  if(!input) return;
  const text = input.value.trim();
  if(!text) return;
  input.disabled = true;
  try{
    const data = await apiFetch(`/conversations/${convId}/messages`, {method:'POST', body:{body:text}});
    input.value = '';
    const wrap = document.querySelector('#chatScroll .bubble-wrap');
    if(wrap){
      wrap.innerHTML = chatBubblesHtml(data.messages);
      const box = document.getElementById('chatScroll');
      if(box) box.scrollTop = box.scrollHeight;
    } else {
      go('chatRoom', convId);
    }
  }
  catch(e){ toast(e.message); }
  finally{ input.disabled=false; input.focus(); }
}
function chatKeydown(ev, convId){ if(ev.key==='Enter'){ ev.preventDefault(); sendMessage(convId); } }

async function uploadResume(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const ext = '.' + (file.name.split('.').pop() || '').toLowerCase();
  const allowedExt = ['.pdf','.doc','.docx','.ppt','.pptx','.hwp'];
  if(!allowedExt.includes(ext)){ toast('PDF, Word, PPT, 한글(HWP) 파일만 업로드할 수 있어요'); return; }
  const fd = new FormData();
  fd.append('resume', file);
  try{
    toast('업로드 중...');
    const res = await fetch(API_BASE + '/profile/resume', {
      method:'POST',
      headers: state.token ? {Authorization:'Bearer '+state.token} : {},
      body: fd,
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || '업로드 실패');
    toast('경력기술서가 업로드됐어요');
    const section = document.getElementById('pf-resume-section');
    if(section) section.innerHTML = resumeSectionHtml(data.resume_url, data.resume_original_name);
  }catch(e){ toast(e.message); }
}

function pickerCatalog(){ return pickerKind === 'stack' ? STACK_CATALOG : CERT_CATALOG; }
function pickerSelected(){ return pickerKind === 'stack' ? pendingStack : pendingCerts; }
function pickerLabel(){ return pickerKind === 'stack' ? '기술스택' : '자격증'; }

// 선택기로 이동하면 화면이 바뀌므로, 입력 중이던 다른 항목들을 임시로 보관해둡니다.
let profileDraft = null;
function captureProfileDraft(){
  const val = (id) => { const el = document.getElementById(id); return el ? el.value : null; };
  const d = {
    name: val('pf-name'), role_title: val('pf-role'), grade: val('pf-grade'),
    rate: val('pf-rate'), summary: val('pf-summary'),
  };
  if(Object.values(d).every(v => v === null)) return; // 폼이 없으면 저장하지 않음
  profileDraft = d;
}
function openPicker(kind){
  captureProfileDraft();
  pickerKind = kind; pickerCategory = '전체'; pickerQuery = '';
  go('pickerScreen');
}

// 현재 분류 · 검색어에 맞는 항목을 추립니다.
function pickerItems(){
  const cat = pickerCatalog();
  let items = [];
  if(pickerCategory === '전체'){
    Object.values(cat).forEach(list => { items = items.concat(list); });
  } else {
    items = (cat[pickerCategory] || []).slice();
  }
  // 직접 추가한 항목(어느 분류에도 없는 것)은 '전체'에서만 함께 보여줍니다.
  // 분류를 골랐을 때는 그 분류의 항목만 나와야 하므로 끼워 넣지 않습니다.
  if(pickerCategory === '전체'){
    const inCatalog = new Set(Object.values(cat).flat());
    pickerSelected().forEach(v => { if(!inCatalog.has(v)) items.push(v); });
  }

  const q = pickerQuery.trim().toLowerCase();
  if(q) items = items.filter(v => v.toLowerCase().includes(q));
  return [...new Set(items)];
}

function screenPicker(){
  const cats = ['전체', ...Object.keys(pickerCatalog())];
  const items = pickerItems();
  const selected = pickerSelected();
  const q = pickerQuery.trim();
  // 검색어가 카탈로그에 없으면 직접 추가할 수 있게 안내합니다.
  const canAddCustom = q && !items.some(v => v.toLowerCase() === q.toLowerCase());

  return `${statusbar()}
  <div class="app-header"><div class="back-row"><div class="back-btn" onclick="go('profileEdit')">${I.back}</div>
    <div><div class="page-title">${pickerLabel()} 선택</div><div class="page-sub">${selected.length}개 선택됨</div></div>
  </div></div>
  <div class="content">
    <div class="search-box">${I.search}<input id="picker-q" value="${esc(pickerQuery)}" placeholder="${pickerLabel()} 검색" oninput="onPickerSearch(this.value)"></div>

    ${selected.length ? `
      <div class="section-label with-ic">${I.checkCircle}선택한 ${pickerLabel()}</div>
      <div class="tag-row">${selected.map((v,i)=>`<span class="tag on rm" onclick="pickerRemove(${i})">${esc(v)} ${I.x}</span>`).join('')}</div>` : ''}

    ${canAddCustom ? `
      <div class="reco-empty" style="text-align:left; margin-top:12px; border-color:var(--amber); background:#FDF6E9;">
        <b style="color:var(--ink);">"${esc(q)}"이(가) 목록에 없나요?</b>
        <div style="margin-top:5px;">직접 추가할 수 있어요.</div>
        <button class="btn btn-primary" style="margin-top:10px;" onclick="pickerAddCustom()">"${esc(q)}" 추가하기</button>
      </div>` : ''}

    <div class="chip-row" style="margin-top:12px;">
      ${cats.map(c=>`<div class="chip ${c===pickerCategory?'active':''}" onclick="setPickerCategory('${jsAttrStr(c)}')">${esc(c)}</div>`).join('')}
    </div>

    <div class="section-label with-ic">${I.layers}${pickerCategory === '전체' ? '전체 목록' : esc(pickerCategory)}</div>
    <div class="tag-row" style="gap:7px;">
      ${items.map(v=>{
        const on = selected.includes(v);
        return `<span class="tag ${on?'on':''}" style="cursor:pointer; padding:9px 13px;" onclick="pickerToggle('${jsAttrStr(v)}')">${on?'✓ ':''}${esc(v)}</span>`;
      }).join('') || `<div class="page-sub">검색 결과가 없어요. 위에서 직접 추가해보세요.</div>`}
    </div>

    <button class="btn btn-primary" style="margin-top:18px;" onclick="go('profileEdit')">선택 완료 (${selected.length}개)</button>
    <div style="height:20px;"></div>
  </div>`;
}

const onPickerSearch = debounce(v => { pickerQuery = v; renderPickerBody(); }, 250);
function setPickerCategory(c){ pickerCategory = c; renderPickerBody(); }
function pickerToggle(v){
  const arr = pickerSelected();
  const i = arr.indexOf(v);
  if(i >= 0) arr.splice(i,1); else arr.push(v);
  renderPickerBody();
}
function pickerRemove(i){ pickerSelected().splice(i,1); renderPickerBody(); }
function pickerAddCustom(){
  const v = pickerQuery.trim();
  if(!v) return;
  const arr = pickerSelected();
  if(!arr.includes(v)) arr.push(v);
  pickerQuery = '';
  renderPickerBody();
  toast(`"${v}" 추가했어요`);
}
// 검색어 입력 포커스를 잃지 않도록 화면 전체가 아닌 내용만 다시 그립니다.
function renderPickerBody(){
  const el = document.getElementById('screen');
  if(!el) return;
  const focused = document.activeElement && document.activeElement.id === 'picker-q';
  const pos = focused ? document.activeElement.selectionStart : null;
  el.innerHTML = screenPicker();
  if(focused){
    const input = document.getElementById('picker-q');
    if(input){ input.focus(); try{ input.setSelectionRange(pos, pos); }catch(e){} }
  }
}

function refreshCertsUI(){
  const el = document.getElementById('pf-certs');
  if(!el) return;
  el.innerHTML = pendingCerts.map((c,i)=>`<span class="tag on rm" onclick="removeProfileCert(${i})">${esc(c)} ${I.x}</span>`).join('');
}
function addProfileCert(){
  const input = document.getElementById('pf-newcert');
  const v = input.value.trim();
  if(!v) return;
  pendingCerts.push(v); input.value=''; refreshCertsUI();
}
function removeProfileCert(i){ pendingCerts.splice(i,1); refreshCertsUI(); }
async function saveProfile(){
  try{
    await apiFetch('/profile', {method:'PUT', body:{
      name: document.getElementById('pf-name').value.trim(),
      role_title: document.getElementById('pf-role').value.trim(),
      grade: document.getElementById('pf-grade').value,
      rate: document.getElementById('pf-rate').value.trim(),
      summary: document.getElementById('pf-summary').value.trim(),
      stack: pendingStack,
      certs: pendingCerts,
    }});
    toast('프로필이 저장됐어요');
    // 지원하려다 프로필 때문에 막혔던 경우, 저장 후 그 공고로 돌아갑니다.
    if(pendingApplyJobId){
      const jobId = pendingApplyJobId;
      pendingApplyJobId = null; profileMissingFields = [];
      go('jobDetail', jobId);
      return;
    }
    go('mypage');
  }catch(e){ toast(e.message); }
}

async function postJob(){
  const title = document.getElementById('pj-title').value.trim();
  if(!title){ toast('공고 제목을 입력해주세요'); return; }
  const stackRaw = document.getElementById('pj-stack').value.trim();
  const stack = stackRaw ? stackRaw.split(',').map(s=>s.trim()).filter(Boolean) : [];
  try{
    await apiFetch('/jobs', {method:'POST', body:{
      title,
      stack,
      period: document.getElementById('pj-period').value.trim(),
      rate: document.getElementById('pj-rate').value.trim(),
      work_type: document.getElementById('pj-type').value.trim(),
      location: document.getElementById('pj-location').value.trim(),
      duty: document.getElementById('pj-duty').value,
      grade: document.getElementById('pj-grade').value,
      deadline: document.getElementById('pj-deadline').value.trim(),
      description: document.getElementById('pj-desc').value.trim(),
    }});
    toast('공고가 등록됐어요');
    jobQuery=''; jobCat='전체'; jobGrade='전체'; jobDuty='';
    go('jobs');
  }catch(e){ toast(e.message); }
}
async function updateJob(id){
  const title = document.getElementById('pj-title').value.trim();
  if(!title){ toast('공고 제목을 입력해주세요'); return; }
  const stackRaw = document.getElementById('pj-stack').value.trim();
  const stack = stackRaw ? stackRaw.split(',').map(s=>s.trim()).filter(Boolean) : [];
  try{
    await apiFetch('/jobs/'+id, {method:'PUT', body:{
      title,
      stack,
      period: document.getElementById('pj-period').value.trim(),
      rate: document.getElementById('pj-rate').value.trim(),
      work_type: document.getElementById('pj-type').value.trim(),
      location: document.getElementById('pj-location').value.trim(),
      duty: document.getElementById('pj-duty').value,
      grade: document.getElementById('pj-grade').value,
      deadline: document.getElementById('pj-deadline').value.trim(),
      description: document.getElementById('pj-desc').value.trim(),
    }});
    toast('공고가 수정됐어요');
    go('jobDetail', id);
  }catch(e){ toast(e.message); }
}

// 프로젝트 단계별로 '지금 누가 무엇을 해야 하는지'를 보여줍니다.
// 내 차례가 아니면 버튼 대신 대기 안내를 표시해, 한쪽이 임의로 단계를 넘길 수 없게 합니다.
function projectActionHtml(p, isCompany){
  if(p.status === '완료'){
    return p.myReview
      ? `<div class="page-sub" style="margin-top:10px;">내가 남긴 평점: ${'★'.repeat(p.myReview.rating)}${'☆'.repeat(5-p.myReview.rating)}</div>`
      : `<button class="btn btn-primary" style="margin-top:10px;" onclick="go('reviewForm', ${p.id})">리뷰 남기기</button>`;
  }
  const wait = (msg) => `<div class="reco-empty" style="margin-top:10px; text-align:left;">${msg}</div>`;

  if(p.stage === 1){
    const iAgreed = isCompany ? p.company_agreed : p.freelancer_agreed;
    const otherAgreed = isCompany ? p.freelancer_agreed : p.company_agreed;
    const otherName = isCompany ? '프리랜서' : '기업';

    // 계약서 영역 — 기업은 첨부/교체, 프리랜서는 열람만 가능합니다.
    let contractBox;
    if(p.contract_url){
      contractBox = `<div class="card" style="margin:10px 0 0; padding:12px;">
        <div style="display:flex; align-items:center; justify-content:space-between; gap:10px;">
          <div style="min-width:0;"><div class="card-title" style="font-size:13px;">📄 ${esc(p.contract_original_name||'계약서')}</div>
          <div class="card-org">첨부됨</div></div>
          <div style="display:flex; gap:6px; flex:0 0 auto;">
            <a href="${viewerUrl(p.contract_url)}" target="_blank" class="btn btn-outline" style="width:auto; padding:9px 12px; font-size:12px;">보기</a>
            <button class="btn btn-outline" style="width:auto; padding:9px 12px; font-size:12px;" onclick="downloadResume('${jsAttrStr(p.contract_url)}', '${jsAttrStr(p.contract_original_name||'계약서')}')">⬇</button>
          </div>
        </div>
        ${isCompany ? `<label class="btn btn-ghost" style="width:auto; padding:8px 12px; font-size:12px; margin-top:8px;">다른 계약서로 교체<input type="file" accept=".pdf,.doc,.docx,.ppt,.pptx,.hwp" style="display:none;" onchange="uploadContract(${p.id}, this)"></label>` : ''}
      </div>`;
    } else {
      contractBox = isCompany
        ? `<div class="reco-empty" style="margin-top:10px; text-align:left; border-color:var(--amber); background:#FDF6E9;">
             <b style="color:var(--ink);">계약서를 첨부해야 계약을 체결할 수 있어요</b>
             <div style="margin-top:6px;">계약서를 올리면 프리랜서가 확인 후 동의합니다.</div>
             <label class="btn btn-primary" style="margin-top:10px;">계약서 첨부하기<input type="file" accept=".pdf,.doc,.docx,.ppt,.pptx,.hwp" style="display:none;" onchange="uploadContract(${p.id}, this)"></label>
           </div>`
        : wait('기업이 <b>계약서를 첨부하면</b> 확인 후 동의할 수 있어요.');
    }

    if(iAgreed){
      return `${contractBox}${wait(`계약에 동의하셨어요.<br><b>${otherName}의 동의를 기다리는 중</b>이에요.`)}`;
    }
    if(!p.contract_url) return contractBox;
    return `${contractBox}
      ${otherAgreed ? `<div class="page-sub" style="margin-top:10px;">${otherName}이(가) 이미 동의했어요.</div>` : ''}
      <button class="btn btn-primary" style="margin-top:10px;" onclick="agreeContract(${p.id})">계약서 확인했고, 동의합니다</button>`;
  }
  if(p.stage === 2){
    return isCompany
      ? wait('프로젝트가 진행 중이에요.<br>프리랜서가 <b>프로젝트 완료</b>를 누르면 확인 단계로 넘어가요.')
      : `<button class="btn btn-primary" style="margin-top:10px;" onclick="reportDone(${p.id})">프로젝트 완료</button>`;
  }
  if(p.stage === 3){
    return isCompany
      ? `<div class="page-sub" style="margin-top:10px;">프리랜서가 프로젝트 완료를 요청했어요.</div>
         <button class="btn btn-primary" style="margin-top:8px;" onclick="settleProject(${p.id})">프로젝트 완료</button>`
      : wait('프로젝트 완료를 요청했어요.<br>기업의 <b>완료 확인</b>을 기다리는 중이에요.');
  }
  return '';
}

async function screenProjects(){
  const nc = await unreadCount();
  const isCompany = state.role === 'company';
  // 기업은 아직 계약된 프로젝트가 없을 때, 등록한 공고와 대기 중인 지원자를 함께 안내합니다.
  const [data, myJobs] = await Promise.all([
    apiFetch('/projects'),
    isCompany ? apiFetch('/jobs').catch(()=>({jobs:[]})) : Promise.resolve({jobs:[]}),

async function savePortfolio(id){
  const title = document.getElementById('pf2-title').value.trim();
  if(!title){ toast('프로젝트명을 입력해주세요'); return; }
  const stackRaw = document.getElementById('pf2-stack').value.trim();
  const body = {
    title,
    client: document.getElementById('pf2-client').value.trim(),
    role_title: document.getElementById('pf2-role').value.trim(),
    period: document.getElementById('pf2-period').value.trim(),
    stack: stackRaw ? stackRaw.split(',').map(s=>s.trim()).filter(Boolean) : [],
    description: document.getElementById('pf2-desc').value.trim(),
    link_url: document.getElementById('pf2-link').value.trim(),
  };
  try{
    if(id) await apiFetch('/portfolios/'+id, {method:'PUT', body});
    else await apiFetch('/portfolios', {method:'POST', body});
    toast(id?'수정됐어요':'등록됐어요');
    go('portfolios');
  }catch(e){ toast(e.message); }
}

  });
}

async function submitChangePassword(){
  const currentPassword = document.getElementById('cp-current').value;
  const newPassword = document.getElementById('cp-new').value;
  const confirmPw = document.getElementById('cp-new-confirm').value;
  if(!currentPassword || !newPassword){ toast('모든 항목을 입력해주세요'); return; }
  if(newPassword !== confirmPw){ toast('새 비밀번호가 일치하지 않아요'); return; }
  try{
    await apiFetch('/auth/change-password', {method:'POST', body:{currentPassword, newPassword}});
    toast('비밀번호가 변경됐어요');
    go('mypage');
  }catch(e){ toast(e.message); }
}

async function submitDeleteAccount(hasPassword){
  if(!confirm('정말로 탈퇴하시겠어요? 이 작업은 되돌릴 수 없어요.')) return;
  const body = {};
  if(hasPassword){
    const password = document.getElementById('da-password').value;
    if(!password){ toast('비밀번호를 입력해주세요'); return; }
    body.password = password;
  }
  try{
    await apiFetch('/auth/me', {method:'DELETE', body});
    toast('탈퇴가 완료됐어요');
    logout();
  }catch(e){ toast(e.message); }
}

/* ---------------- 푸시 알림 ---------------- */
// 브라우저가 요구하는 형식(Uint8Array)으로 공개키를 변환합니다.
function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64);
  const arr = new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) arr[i] = raw.charCodeAt(i);
  return arr;
}
function pushSupported(){
  return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
}
async function getPushSubscription(){
  if(!pushSupported()) return null;
  try{
    const reg = await navigator.serviceWorker.ready;
    return await reg.pushManager.getSubscription();
  }catch(e){ return null; }
}
async function enablePush(){
  if(!pushSupported()){
    toast('이 브라우저에서는 알림을 지원하지 않아요');
    return false;
  }
  try{
    const permission = await Notification.requestPermission();
    if(permission !== 'granted'){
      toast('알림이 차단되어 있어요. 브라우저 설정에서 허용해주세요.');
      return false;
    }
    const { publicKey } = await apiFetch('/push/public-key');
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(!sub){
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(publicKey),
      });
    }
    const json = sub.toJSON();
    await apiFetch('/push/subscribe', {method:'POST', body:{ endpoint: json.endpoint, keys: json.keys }});
    toast('알림이 켜졌어요');
    return true;
  }catch(e){
    toast('알림 설정에 실패했어요: ' + e.message);
    return false;
  }
}
async function disablePush(){
  try{
    const sub = await getPushSubscription();
    if(sub){
      await apiFetch('/push/unsubscribe', {method:'POST', body:{ endpoint: sub.endpoint }});
      await sub.unsubscribe();
    }
    toast('알림을 껐어요');
    return true;
  }catch(e){ toast(e.message); return false; }
}
async function togglePush(el){
  const on = el.checked;
  const ok = on ? await enablePush() : await disablePush();
  if(!ok) el.checked = !on; // 실패하면 스위치를 원래대로 되돌립니다
}
async function testPush(){
  try{
    await apiFetch('/push/test', {method:'POST'});
    toast('테스트 알림을 보냈어요. 잠시 후 알림창을 확인해주세요.');
  }catch(e){ toast(e.message); }
}
// 낡은 서비스워커가 남아 알림이 안 오는 경우를 위한 복구 기능.
// 기존 등록을 모두 지우고 최신 버전으로 다시 설치한 뒤 알림을 재등록합니다.
async function repairPush(){
  showConfirm('알림 기능을 다시 설치할까요?', async () => {
    try{
      toast('다시 설치하는 중...');
      // 1) 이 기기의 기존 구독 해제
      try{
        const sub = await getPushSubscription();
        if(sub){
          await apiFetch('/push/unsubscribe', {method:'POST', body:{ endpoint: sub.endpoint }}).catch(()=>{});
          await sub.unsubscribe().catch(()=>{});
        }
      }catch(e){}
      // 2) 낡은 서비스워커 전부 제거
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister().catch(()=>{})));
      // 3) 캐시도 비움
      if(window.caches){
        const names = await caches.keys();
        await Promise.all(names.map(n => caches.delete(n).catch(()=>{})));
      }
      // 4) 최신 서비스워커 재설치 후 알림 재등록
      const reg = await navigator.serviceWorker.register('/service-worker.js', { updateViaCache: 'none' });
      await navigator.serviceWorker.ready;
      await enablePush();
      toast('다시 설치했어요. 알림 테스트를 눌러보세요.');
      render();
    }catch(e){ toast('복구 실패: ' + e.message); }
  });
}
// 로그인 직후, 알림을 켠 적 있는 기기라면 서버 구독을 조용히 최신화합니다.
async function syncPushSubscription(){
  if(!pushSupported() || Notification.permission !== 'granted') return;
  try{
    const sub = await getPushSubscription();
    if(!sub) return;
    const json = sub.toJSON();
    await apiFetch('/push/subscribe', {method:'POST', body:{ endpoint: json.endpoint, keys: json.keys }});
  }catch(e){}
}

/* ---------------- 홈 화면에 추가(앱 설치) ---------------- */
// 크롬이 "설치 가능" 신호를 보내면 붙잡아 뒀다가, 사용자가 버튼을 눌렀을 때 설치창을 띄웁니다.
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  // 마이페이지가 열려 있으면 설치 버튼이 바로 보이도록 다시 그립니다.
  if(state.screen === 'mypage') render();
});
window.addEventListener('appinstalled', () => {
  deferredInstallPrompt = null;
  toast('홈 화면에 추가됐어요');
});
function isInstalledApp(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}
async function installApp(){
  if(!deferredInstallPrompt){
    showConfirm(
      '이미 설치되어 있거나, 브라우저가 설치를 지원하지 않는 상태예요.\n\n' +
      '휴대폰 설정 → 애플리케이션에서 "김프리"를 찾아 삭제한 뒤 다시 시도해주세요.',
      () => {}
    );
    return;
  }
  deferredInstallPrompt.prompt();
  try{ await deferredInstallPrompt.userChoice; }catch(e){}
  deferredInstallPrompt = null;
  render();
}

if('serviceWorker' in navigator){
  window.addEventListener('load', async () => {
    try{
      // updateViaCache:'none' → 서비스워커 파일을 항상 서버에서 새로 받아옵니다.
      // (낡은 버전이 캐시에 남아 푸시 같은 새 기능이 동작하지 않는 것을 방지)
      const reg = await navigator.serviceWorker.register('/service-worker.js', { updateViaCache: 'none' });
      reg.update().catch(()=>{});
      setInterval(() => reg.update().catch(()=>{}), 30 * 60 * 1000);

      // 새 버전이 설치되면 기다리지 않고 바로 교체합니다.
      reg.addEventListener('updatefound', () => {
        const sw = reg.installing;
        if(!sw) return;
        sw.addEventListener('statechange', () => {
          if(sw.state === 'installed' && navigator.serviceWorker.controller){
            sw.postMessage({ type: 'SKIP_WAITING' });
          }
        });
      });
    }catch(e){}
  });

  // 새 서비스워커가 실제로 제어권을 잡으면 화면을 한 번 새로고침해 최신 상태로 맞춥니다.
  let swReloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if(swReloaded) return;
    swReloaded = true;
    window.location.reload();
  });
}
</script>
