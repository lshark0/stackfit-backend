name: Keep STACKFIT backend awake

on:
  schedule:
    # 5분마다 실행 (Render는 15분, Neon DB는 그보다 훨씬 짧게 유휴 시 잠들기 때문에 더 자주 깨움)
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -sf --max-time 30 https://stackfit-backend.onrender.com/api/health || echo "핑 실패 (일시적일 수 있음, 다음 스케줄에서 재시도)"
