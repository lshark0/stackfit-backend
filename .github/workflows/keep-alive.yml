name: Keep STACKFIT backend awake

on:
  schedule:
    # 10분마다 실행 (Render 무료 플랜은 15분간 요청이 없으면 잠듭니다)
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -sf --max-time 30 https://stackfit-backend.onrender.com/api/health || echo "핑 실패 (일시적일 수 있음, 다음 스케줄에서 재시도)"
